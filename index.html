<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const supported = (value) => value === 'ar' || value === 'en';
        const explicit = location.pathname.split('/')[1];
        let language = supported(explicit) ? explicit : null;
        if (!language) {
          try {
            const saved = localStorage.getItem('alsalloum.language.v1');
            if (supported(saved)) language = saved;
          } catch {}
        }
        if (!language) {
          for (const candidate of navigator.languages || [navigator.language]) {
            const short = candidate.toLowerCase().split('-')[0];
            if (supported(short)) {
              language = short;
              break;
            }
          }
        }
        document.documentElement.lang = language || 'ar';
        document.documentElement.dir = language === 'en' ? 'ltr' : 'rtl';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#253b59" />
    <meta
      name="description"
      content="شركة السلوم الطبية، منذ 2007. تجهيزات العمليات العظمية والعصبية ومستلزمات المفاصل والعمود الفقري في سوريا."
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/fonts/alexandria.css" />
    <title>السلوم الطبية | تجهيزات الجراحة العظمية والعصبية</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #fff;
        color: #253b59;
        font-family: Alexandria, 'Segoe UI', Arial, sans-serif;
        transition: opacity 0.18s ease-out;
      }
      #boot-loader.boot-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .boot-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      #boot-recovery[hidden] {
        display: none;
      }
      .boot-logo {
        width: 84px;
        height: 84px;
        object-fit: contain;
      }
      .boot-name {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
      }
      .boot-status {
        margin: 0;
        font-size: 0.9rem;
        color: #4b6078;
        line-height: 1.8;
      }
      .boot-track {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: #eaf3fa;
        overflow: hidden;
      }
      .boot-track::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        background: #025d9c;
        animation: boot-progress 1.1s ease-in-out infinite alternate;
      }
      [lang='ar'] [data-boot-lang='en'],
      [lang='en'] [data-boot-lang='ar'] {
        display: none;
      }
      @keyframes boot-progress {
        to {
          transform: translateX(125%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader {
          transition: none;
        }
        .boot-track::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="boot-content">
        <img
          class="boot-logo"
          src="/assets/alsalloum-logo-small.webp"
          alt=""
          width="84"
          height="84"
        />
        <p class="boot-name">
          <span data-boot-lang="ar">السلوم الطبية</span
          ><span data-boot-lang="en">Alsalloum Medical</span>
        </p>
        <span class="boot-track" aria-hidden="true"></span>
        <p class="boot-status">
          <span data-boot-lang="ar">نجهّز الصفحة لك…</span
          ><span data-boot-lang="en">Preparing your page…</span>
        </p>
      </div>
    </div>
    <div id="root"></div>
    <div
      id="boot-recovery"
      class="boot-content"
      hidden
      style="min-height: 100vh; justify-content: center"
    >
      <p class="boot-name">السلوم الطبية · Alsalloum Medical</p>
      <p>اختر لغتك للمتابعة · Choose your language</p>
      <a href="/ar">العربية</a><a href="/en">English</a>
      <a href="https://wa.me/963935584468">واتساب · WhatsApp</a>
    </div>
    <script>
      (() => {
        const loader = document.getElementById('boot-loader');
        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          clearTimeout(deadline);
          loader.classList.add('boot-leaving');
          const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180;
          setTimeout(() => {
            loader.remove();
            if (!document.getElementById('root').hasChildNodes())
              document.getElementById('boot-recovery').hidden = false;
            window.dispatchEvent(new Event('alsalloum:boot-complete'));
          }, delay);
          window.removeEventListener('alsalloum:app-ready', finish);
        };
        const deadline = setTimeout(finish, 3500);
        window.addEventListener('alsalloum:app-ready', finish);
      })();
    </script>
    <noscript
      ><style>
        #boot-loader {
          display: none !important;
        }
      </style>
      <p dir="rtl">
        يرجى تفعيل JavaScript لتصفح الموقع. للتواصل:
        <a href="https://wa.me/963935584468">واتساب 0935584468</a>.
      </p></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
